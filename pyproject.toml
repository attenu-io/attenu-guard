[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attenu-guard"
version = "0.8.1"
description = "Attenu Guard: enforces per-agent permissions on every tool call and sub-agent handoff — a sub-agent never holds more than its parent — and writes a hash-chained audit log you verify offline. 17 agent frameworks and protocols, unmodified."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Attenu" }]
keywords = ["ai", "agents", "security", "authorization", "least-privilege", "delegation", "sub-agents", "audit-log", "mcp", "a2a", "owasp", "langgraph", "langchain", "crewai", "openai-agents", "google-adk", "autogen", "claude-agent-sdk", "pydantic-ai", "smolagents", "camel-ai", "langflow", "strands", "llama-index", "semantic-kernel", "agno", "agent-framework", "ag2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Logging",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41"]      # Ed25519 production signer for the wire format
yaml = ["pyyaml>=6"]              # YAML scenario files (JSON works with no deps)
langgraph = ["langgraph>=0.2"]   # adapters.langgraph (node/tool-callable wrapper)
# Framework adapters (attenu_guard.adapters.<name>). Floors = the versions the
# integration tests were validated against (Aug 2026); the core stays zero-dependency —
# an adapter module imports its framework only when YOU import that adapter.
langchain = ["langgraph>=1.2", "langchain>=1.3", "langchain-core>=1.5"]   # adapters.langchain: ToolNode / create_agent / deepagents
deepagents = ["deepagents>=0.7", "langgraph>=1.2", "langchain>=1.3"]
openai-agents = ["openai-agents>=0.21"]
google-adk = ["google-adk>=2.7"]
pydantic-ai = ["pydantic-ai-slim>=2.31"]
crewai = ["crewai>=1.15"]
autogen = ["autogen-agentchat>=0.7", "autogen-ext>=0.7"]
agent-framework = ["agent-framework>=1.15"]   # adapters.agent_framework: Microsoft Agent Framework (the AutoGen + SK successor)
ag2 = ["ag2>=1.0"]                            # adapters.ag2: AG2 1.0, the AutoGen fork (package `ag2`)
claude-agent-sdk = ["claude-agent-sdk>=0.2"]
smolagents = ["smolagents>=1.26"]
strands = ["strands-agents>=1.52"]
llama-index = ["llama-index-core>=0.14"]
semantic-kernel = ["semantic-kernel>=1.36"]
agno = ["agno>=2.9"]
haystack = ["haystack-ai>=3.1"]
camel = ["camel-ai>=0.2.90", "mcp<3"]      # adapters.camel; camel-ai 0.2.90 imports mcp.server.FastMCP, absent in mcp 2.x
omnigent = ["omnigent>=0.10"]         # examples/integrations/omnigent (policy handler); no adapter module
mcp = ["mcp>=1.28"]                   # examples/integrations/mcp (server-side chain verifier)
a2a = ["a2a-sdk>=1.1"]                # adapters.a2a: Agent2Agent protocol (client interceptor + guarded AgentExecutor)
langflow = ["lfx>=1.11", "langchain-core>=1.5"]  # examples/integrations/langflow (custom component); no adapter module
test = ["pytest>=7", "hypothesis>=6"]
all = ["cryptography>=41", "pyyaml>=6"]

[project.scripts]
attenu-guard = "attenu_guard.cli:main"

[project.urls]
Homepage = "https://attenu.io"
Documentation = "https://attenu.io/docs/"
Source = "https://github.com/attenu-io/attenu-guard"
Issues = "https://github.com/attenu-io/attenu-guard/issues"
Changelog = "https://github.com/attenu-io/attenu-guard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, which includes the JSON in
# src/attenu_guard/vectors/ — the Internet-Draft's interop test vectors, so that
# checking an independent implementation needs only `pip install attenu-guard`.
# The quickstart-canary CI job verifies they survive an install.
packages = ["src/attenu_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
