name: release
# Publishes to PyPI via trusted publishing when a version tag is pushed. Inert until the PyPI project
# "attenu-guard" exists with this repository configured as its trusted publisher (environment: pypi).
permissions: read-all
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # sigstore signing for the build attestation
      attestations: write    # SLSA provenance for every wheel/sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Version tag must match the package version
        run: |
          pip install -q --require-hashes -r .github/workflows/requirements-build.txt
          V=$(python -c "import re,pathlib;print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject $V"; exit 1; }
      - name: Build sdist + wheel
        run: python -m build
      - name: Check the distribution
        # requirements-twine.txt is regenerated from requirements-twine.in with:
        #   docker run --rm --platform linux/amd64 -v "$PWD/.github/workflows:/out" python:3.12-slim bash -c \
        #     'pip install -q pip-tools && cd /out && pip-compile --generate-hashes --allow-unsafe --strip-extras -o requirements-twine.txt requirements-twine.in'
        # (same recipe for requirements-build.txt). Run in a linux/amd64 container so the
        # resolved hashes match ubuntu-latest, the runner this workflow actually uses.
        run: |
          pip install -q --require-hashes -r .github/workflows/requirements-twine.txt
          twine check dist/*
      - name: Attest build provenance (SLSA, sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist/ }
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
  github-release:
    # Without this the tag exists but no Release object does, so the repository's
    # front page keeps advertising an older version than PyPI actually serves —
    # which is what happened between 0.5.0 and 0.6.1.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist/ }
      - name: Cut the GitHub Release from this version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          # The section for this version only: from its heading to the next one.
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for ${V}." > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "attenu-guard ${V}" --notes-file notes.md
